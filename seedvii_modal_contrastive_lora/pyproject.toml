[project]
name = "seedvii-modal-contrastive-lora"
version = "0.1.0"
description = "SEED-VII EEGNet and LoRA LLM contrastive training pipeline for ModelScope"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["seedvii_contrastive*"]
